# ==============================================
# PRODUCTION Docker Compose for LXC Server
# ==============================================
# Salin fail ini ke server sebagai docker-compose.yml
# Buat fail .env di sebelah fail ini dengan semua config

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: saashouse
      POSTGRES_DB: saashouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1024M
    # Port 5432 ditutup dari luar untuk keselamatan prod


  backend:
    image: ghcr.io/muhammadkmal27/saashouse/backend:main
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M


  nginx:
    image: nginx:alpine
    restart: always
    container_name: saas_nginx_proxy
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M


  frontend:
    image: ghcr.io/muhammadkmal27/saashouse/frontend:main
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:8080"


  pgadmin:
    image: dpage/pgadmin4
    container_name: saas_pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saashouse.com
      PGADMIN_DEFAULT_PASSWORD: rootpassword
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "10"
    ports:
      - "8081:80"
    depends_on:
      - postgres
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M


  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  # [NEW] Stripe CLI Service untuk Testing Webhooks
  stripe:
    image: stripe/stripe-cli
    restart: always
    container_name: stripe_webhook_listener
    command: >
      listen --api-key ${STRIPE_SECRET_KEY}
      --forward-to backend:8080/api/webhooks/stripe
    depends_on:
      - backend
    env_file: .env

volumes:
  pgdata:
  redis_data:
