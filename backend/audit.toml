# Cargo Audit configuration for saas_house backend
[advisories]
ignore = [
    "RUSTSEC-2026-0367", # Insecure Preservation of SUID/SGID Bits during ZIP Extraction
    "RUSTSEC-2026-0368", # zip: ZipArchive::extract symlink outside destination directory
    "RUSTSEC-2026-0369", # ZipStreamReader::extract Unix permissions through symlinks
    "RUSTSEC-2026-0386", # AsyncFd::new and related constructors violate I/O safety
    "RUSTSEC-2026-0221", # event-listener StackSlot
    "RUSTSEC-2026-0385", # ctutils non-constant-time mask generation
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames
    "RUSTSEC-2026-0348", # rustls Brotli certificate decompression
    "RUSTSEC-2026-0349", # rustls Unauthenticated ServerHello
    "RUSTSEC-2026-0346", # rustls Debug impls expose TLS secrets
    "RUSTSEC-2026-0285", # rustls TLS 1.3 handshake messages
    "RUSTSEC-2026-0382", # rustls-webpki certificate verification
    "RUSTSEC-2026-0381", # webpki-roots bundled root certificates
]
