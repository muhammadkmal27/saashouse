version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_house_db
    environment:
      POSTGRES_USER: saashouse
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: saashouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: saas_pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saashouse.com
      PGADMIN_DEFAULT_PASSWORD: rootpassword
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "10"
    ports:
      - "8081:80"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saas_house_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_house_backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  stripe:
    image: stripe/stripe-cli
    container_name: saas_house_stripe
    restart: always
    command: >
      listen --api-key ${STRIPE_SECRET_KEY}
      --forward-to backend:8080/api/webhooks/stripe
    depends_on:
      - backend
    env_file: .env

  nginx:
    image: nginx:alpine
    container_name: saas_house_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: